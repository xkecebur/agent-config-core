name: Claude Code Review

# Automatic review on pull requests.
#
# Uses `pull_request`, not `pull_request_target`, so a fork PR runs without repository
# secrets - the Pwnrequest pattern described in the devops-pipeline module. The trade-off
# is that automatic review does not run for fork contributions; a maintainer can still
# invoke it there with an @claude comment (see claude.yml).
#
# Actions are pinned to a commit SHA to match the rule this repository teaches.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

jobs:
  claude-review:
    # Skip drafts and Dependabot: reviewing a machine-generated version bump spends quota
    # for no benefit.
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
